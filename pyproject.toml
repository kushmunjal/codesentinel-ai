[project]
name = "codesentinel-ai"
requires-python = ">=3.12"
version = "0.1.0"
dependencies = [
    "fastapi",
    "uvicorn",
    "requests",
    "tiktoken",
    "pydantic",
    "SQLAlchemy",
    "PyYAML",
    "prometheus-client"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy"
]

[tool.ruff]
target-version = "py312"
exclude = [
    ".venv",
    "venv",
    "dist",
    "build",
    "console",
    "patch_*.py",
    "pipeline_output*.txt",
    "update_ui*.py",
    "seed_db.py",
    "test-repo",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E402",
    "E501",
    "E701",
    "F401",
    "F541",
    "F841",
]
