[project]
name = "codesentinel-ai"
requires-python = ">=3.12"
version = "0.1.0"
dependencies = [
    "fastapi",
    "uvicorn",
    "requests",
    "tiktoken",
    "pydantic",
    "SQLAlchemy",
    "PyYAML",
    "prometheus-client",
    "pyjwt",
    "bcrypt"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "ruff",
    "playwright"
]
