name: Security & Supply Chain

on:
  push:
    branches: [main, ws/security]
  pull_request:
    branches: [main]

# Least-privilege permissions: read-only access to repository contents
permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest

      - name: Run Security and Prompt Injection Test Suite
        run: |
          pytest tests/security/ -v
